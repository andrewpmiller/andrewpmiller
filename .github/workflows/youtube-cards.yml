name: GitHub Readme YouTube Cards
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: youtube-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # Pre-check: probe the YouTube RSS feed so logs distinguish a YouTube
      # outage (non-2xx/slow here) from a bug in the cards action. Never fails.
      - name: Pre-check YouTube RSS feed
        continue-on-error: true
        run: |
          curl -sS -o /dev/null \
            -w 'rss_http_code=%{http_code} rss_time_total=%{time_total}s rss_size=%{size_download}B\n' \
            --max-time 30 \
            'https://www.youtube.com/feeds/videos.xml?channel_id=UCcSnI3n2Jd-2qgncC6k_S1g' || true

      # Attempt 1: direct (no wrapper). This action exits 0 even on feed
      # fetch failure (empty markdown), so retry is handled by the
      # second attempt below, not by failure-retry wrappers.
      # NOTE: pinned to a02c9b2b... = upstream main HEAD, the commit that bumps
      # inner actions to Node 24 (checkout@v5 / setup-python@v7 /
      # add-and-commit@v11). 1.8.0 (bea8b4b) still pins Node 20 actions and
      # triggers the Node 20 deprecation warning. action.py is byte-identical
      # between the two, so this pin only changes the action runtime.
      # Still SHA-pinned; do not float to @main.
      - name: Generate YouTube cards (attempt 1)
        id: cards_attempt1
        continue-on-error: true
        uses: DenverCoder1/github-readme-youtube-cards@a02c9b2b841c1cae3e8651571c0146a627423dc1 # main (Node 24 runtime)
        with:
          channel_id: UCcSnI3n2Jd-2qgncC6k_S1g
          lang: en
          output_only: true

      - name: Wait before retry
        if: steps.cards_attempt1.outputs.markdown == ''
        run: sleep 60

      # Attempt 2: only runs if attempt 1 produced empty output (transient
      # YouTube RSS blip). Exhausted retries fall through to the fail-open
      # verify step below, so transient failures stay green and retry next schedule.
      - name: Generate YouTube cards (attempt 2)
        id: cards_attempt2
        if: steps.cards_attempt1.outputs.markdown == ''
        continue-on-error: true
        uses: DenverCoder1/github-readme-youtube-cards@a02c9b2b841c1cae3e8651571c0146a627423dc1 # main (Node 24 runtime)
        with:
          channel_id: UCcSnI3n2Jd-2qgncC6k_S1g
          lang: en
          output_only: true

      # Shim: expose first non-empty markdown as steps.cards.outputs.markdown
      # so downstream steps are unchanged.
      - name: Expose cards markdown
        id: cards
        env:
          MARKDOWN1: ${{ steps.cards_attempt1.outputs.markdown }}
          MARKDOWN2: ${{ steps.cards_attempt2.outputs.markdown }}
        run: |
          if [ -n "$MARKDOWN2" ]; then
            markdown="$MARKDOWN2"
          else
            markdown="$MARKDOWN1"
          fi
          {
            echo 'markdown<<CARDS_EOF'
            printf '%s\n' "$markdown"
            echo 'CARDS_EOF'
          } >> "$GITHUB_OUTPUT"

      # Upstream emits `markdown` via an unquoted `echo`, which collapses card
      # line breaks and flattens the section onto a single line. Re-split it into
      # one card per line by extracting each card image in order. Idempotent: an
      # already well-formed section produces the same result.
      - name: Normalize cards onto separate lines
        id: normalized
        env:
          MARKDOWN: ${{ steps.cards.outputs.markdown }}
        run: |
          normalized=$(python3 - <<'PY'
          import os, re
          md = os.environ.get("MARKDOWN", "")
          md = re.sub(r"\s+", " ", md).strip()
          if not md:
              print("")
              raise SystemExit(0)
          # Split at each card start rather than matching parens: card titles
          # and URLs contain parentheses, so paren matching is unreliable.
          starts = [m.start() for m in re.finditer(r"\[!\[[^\]]*\]\(", md)]
          if len(starts) < 2:
              print(md)
              raise SystemExit(0)
          cards = [
              md[s:(starts[k + 1] if k + 1 < len(starts) else len(md))].strip()
              for k, s in enumerate(starts)
          ]
          print("\n".join(cards))
          PY
          )
          {
            echo 'markdown<<NORM_EOF'
            printf '%s\n' "$normalized"
            echo 'NORM_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "Cards on separate lines: $(printf '%s\n' "$normalized" | grep -c '^\[!\[' || true)"

      # Fail-open: empty markdown warns + sets skip=true (exit 0) instead of
      # failing the run. Logs length + first 500 chars for diagnostics.
      - name: Verify cards were generated
        id: verify
        env:
          MARKDOWN: ${{ steps.normalized.outputs.markdown }}
        run: |
          len=$(printf '%s' "$MARKDOWN" | wc -c)
          echo "Markdown length: ${len} chars"
          echo "First 500 chars:"
          printf '%s' "$MARKDOWN" | head -c 500
          echo
          if [ -z "$MARKDOWN" ]; then
            echo "::warning::No YouTube cards generated — skipping README update; next scheduled run will retry."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "YouTube cards verified successfully"

      - name: Write cards to README
        if: steps.verify.outputs.skip != 'true'
        env:
          MARKDOWN: ${{ steps.normalized.outputs.markdown }}
        run: |
          # Belt-and-suspenders: never write an empty section even if gating fails.
          if [ -z "$MARKDOWN" ]; then
            echo "::warning::Empty markdown at write step — refusing to write."
            exit 0
          fi
          python3 - <<'PY'
          import os, re
          markdown = os.environ["MARKDOWN"]
          if not markdown.strip():
              print("::warning::Empty markdown at write step — refusing to write.")
              raise SystemExit(0)
          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()
          pattern = r"(<!-- BEGIN YOUTUBE-CARDS -->).*?(<!-- END YOUTUBE-CARDS -->)"
          if not re.search(pattern, content, flags=re.DOTALL):
              raise ValueError("YouTube cards markers not found in README.md")
          content = re.sub(
              pattern,
              lambda m: m.group(1) + "\n" + markdown + "\n" + m.group(2),
              content,
              flags=re.DOTALL,
          )
          with open("README.md", "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Commit and push
        if: steps.verify.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Update YouTube cards ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash
            git push
          else
            echo "No changes to commit"
          fi
