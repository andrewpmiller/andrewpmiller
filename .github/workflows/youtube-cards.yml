name: GitHub Readme YouTube Cards
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/youtube-cards.yml
  pull_request:
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/youtube-cards.yml

concurrency:
  group: youtube-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # Single source of truth: the pre-check probe and the card fetch must
      # agree, or the probe can report 200 while the actual fetch is failing —
      # the one signal we rely on during an outage.
      CHANNEL_ID: UCcSnI3n2Jd-2qgncC6k_S1g
      # Where the card section lives: a user profile is README.md at the repo
      # root; an org profile is profile/README.md inside its .github repo.
      README_PATH: README.md
    steps:
      - uses: actions/checkout@v5

      - name: Run card tests
        run: python3 tests/test_cards.py

      # Pre-check: probe the YouTube RSS feed so the log can tell a YouTube
      # outage (404/500/slow here) from a bug in our own fetch. Never fails.
      - name: Pre-check YouTube RSS feed
        id: precheck
        continue-on-error: true
        run: |
          probe=$(curl -sS -o /dev/null \
            -w '%{http_code} %{time_total}s %{size_download}B' \
            --max-time 30 \
            "https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}" \
            || echo "curl failed")
          echo "rss_probe=${probe}"
          echo "rss_probe=${probe}" >> "$GITHUB_OUTPUT"

      # Fetch the feed and build the card markdown (logic in scripts/fetch_cards.py).
      # Exits 0 even when the feed fails, so the health check below decides
      # whether an empty result is a blip to tolerate or an outage to fail on.
      - name: Fetch YouTube cards
        id: cards
        run: python3 scripts/fetch_cards.py

      # Logs length + first 500 chars for diagnostics. A failed fetch is not
      # automatically an error: a one-off blip stays green and the next run
      # retries, while several consecutive failures go red. The streak lives in
      # .github/youtube-feed-state.json so idle, upload-free days never count
      # against it (see scripts/feed_health.py).
      - name: Check feed health
        id: verify
        env:
          MARKDOWN: ${{ steps.cards.outputs.markdown }}
        run: |
          echo "precheck: ${{ steps.precheck.outputs.rss_probe }}"
          len=$(printf '%s' "$MARKDOWN" | wc -c)
          echo "Markdown length: ${len} chars"
          echo "First 500 chars:"
          printf '%s' "$MARKDOWN" | head -c 500
          echo
          if [ -n "$MARKDOWN" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            feed_ok=true
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            feed_ok=false
          fi
          # Record the outage instead of failing here, so the commit step can
          # still persist the failure count.
          FEED_OK="$feed_ok" python3 scripts/feed_health.py || echo "fail=true" >> "$GITHUB_OUTPUT"

      - name: Write cards to README
        if: steps.verify.outputs.skip != 'true'
        env:
          MARKDOWN: ${{ steps.cards.outputs.markdown }}
        run: python3 scripts/write_cards.py

      - name: Commit and push
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The feed-health count must persist even when the README is skipped
          # and even when the run is red, so this step is not gated on `skip`.
          git add "$README_PATH" .github/youtube-feed-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update YouTube cards / feed health ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash
            git push
          else
            echo "No changes to commit"
          fi

      # Fails only after the commit step, so the failure count is persisted
      # even on the run that goes red.
      - name: Fail on feed outage
        if: steps.verify.outputs.fail == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: exit 1
