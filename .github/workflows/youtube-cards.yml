name: GitHub Readme YouTube Cards
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: youtube-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The staleness gate needs history to date the last card commit;
          # checkout's default of 1 commit would hide it.
          fetch-depth: 0

      - name: Run card tests
        run: python3 tests/test_cards.py

      # Pre-check: probe the YouTube RSS feed so logs distinguish a YouTube
      # outage (non-2xx/slow here) from a bug in the cards action. Never fails.
      - name: Pre-check YouTube RSS feed
        continue-on-error: true
        run: |
          curl -sS -o /dev/null \
            -w 'rss_http_code=%{http_code} rss_time_total=%{time_total}s rss_size=%{size_download}B\n' \
            --max-time 30 \
            'https://www.youtube.com/feeds/videos.xml?channel_id=UCcSnI3n2Jd-2qgncC6k_S1g' || true

      # Attempt 1: direct (no wrapper). This action exits 0 even on feed
      # fetch failure (empty markdown), so retry is handled by the
      # second attempt below, not by failure-retry wrappers.
      # NOTE: pinned to a02c9b2b... = upstream main HEAD, the commit that bumps
      # inner actions to Node 24 (checkout@v5 / setup-python@v7 /
      # add-and-commit@v11). 1.8.0 (bea8b4b) still pins Node 20 actions and
      # triggers the Node 20 deprecation warning. action.py is byte-identical
      # between the two, so this pin only changes the action runtime.
      # Still SHA-pinned; do not float to @main.
      - name: Generate YouTube cards (attempt 1)
        id: cards_attempt1
        continue-on-error: true
        uses: DenverCoder1/github-readme-youtube-cards@a02c9b2b841c1cae3e8651571c0146a627423dc1 # main (Node 24 runtime)
        with:
          channel_id: UCcSnI3n2Jd-2qgncC6k_S1g
          lang: en
          output_only: true

      - name: Wait before retry
        if: steps.cards_attempt1.outputs.markdown == ''
        run: sleep 60

      # Attempt 2: only runs if attempt 1 produced empty output (transient
      # YouTube RSS blip). If both attempts come back empty, the verify step
      # below decides: tolerate it if the README is still fresh, fail if it
      # has gone stale.
      - name: Generate YouTube cards (attempt 2)
        id: cards_attempt2
        if: steps.cards_attempt1.outputs.markdown == ''
        continue-on-error: true
        uses: DenverCoder1/github-readme-youtube-cards@a02c9b2b841c1cae3e8651571c0146a627423dc1 # main (Node 24 runtime)
        with:
          channel_id: UCcSnI3n2Jd-2qgncC6k_S1g
          lang: en
          output_only: true

      # Shim: expose first non-empty markdown as steps.cards.outputs.markdown
      # so downstream steps are unchanged.
      - name: Expose cards markdown
        id: cards
        env:
          MARKDOWN1: ${{ steps.cards_attempt1.outputs.markdown }}
          MARKDOWN2: ${{ steps.cards_attempt2.outputs.markdown }}
        run: |
          if [ -n "$MARKDOWN2" ]; then
            markdown="$MARKDOWN2"
          else
            markdown="$MARKDOWN1"
          fi
          {
            echo 'markdown<<CARDS_EOF'
            printf '%s\n' "$markdown"
            echo 'CARDS_EOF'
          } >> "$GITHUB_OUTPUT"

      # Upstream emits `markdown` via an unquoted `echo`, which collapses card
      # line breaks and flattens the section onto a single line. Re-split it
      # onto one card per line (logic in scripts/normalize_cards.py).
      - name: Normalize cards onto separate lines
        id: normalized
        env:
          MARKDOWN: ${{ steps.cards.outputs.markdown }}
        run: python3 scripts/normalize_cards.py

      # Logs length + first 500 chars for diagnostics. A single feed failure
      # stays green: the README is still fresh and the next scheduled run
      # retries. It only fails once the README has gone un-updated for
      # STALE_DAYS, so a real outage is still loud.
      - name: Verify cards were generated
        id: verify
        env:
          MARKDOWN: ${{ steps.normalized.outputs.markdown }}
        run: |
          len=$(printf '%s' "$MARKDOWN" | wc -c)
          echo "Markdown length: ${len} chars"
          echo "First 500 chars:"
          printf '%s' "$MARKDOWN" | head -c 500
          echo
          if [ -z "$MARKDOWN" ]; then
            if python3 scripts/card_staleness.py; then
              echo "::warning::No YouTube cards generated, but the README is still fresh — skipping this run; the next scheduled run will retry."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::No YouTube cards generated after two attempts and the README is now stale — README left unchanged."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "YouTube cards verified successfully"

      - name: Write cards to README
        if: steps.verify.outputs.skip != 'true'
        env:
          MARKDOWN: ${{ steps.normalized.outputs.markdown }}
        run: python3 scripts/write_cards.py

      - name: Commit and push
        if: steps.verify.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Update YouTube cards ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash
            git push
          else
            echo "No changes to commit"
          fi
