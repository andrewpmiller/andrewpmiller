name: GitHub Readme YouTube Cards
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: youtube-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate YouTube cards
        id: cards
        uses: DenverCoder1/github-readme-youtube-cards@bea8b4bc2094973fe3c3a49d86076328588dc454  # 1.8.0
        with:
          channel_id: UCcSnI3n2Jd-2qgncC6k_S1g
          lang: en
          output_only: true

      - name: Verify cards were generated
        env:
          MARKDOWN: ${{ steps.cards.outputs.markdown }}
        run: |
          if [ -z "$MARKDOWN" ]; then
            echo "::error::No YouTube cards generated — the feed fetch failed silently."
            exit 1
          fi
          echo "YouTube cards verified successfully"

      - name: Write cards to README
        env:
          MARKDOWN: ${{ steps.cards.outputs.markdown }}
        run: |
          python3 - <<'PY'
          import os, re
          markdown = os.environ["MARKDOWN"]
          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()
          pattern = r"(<!-- BEGIN YOUTUBE-CARDS -->).*?(<!-- END YOUTUBE-CARDS -->)"
          if not re.search(pattern, content, flags=re.DOTALL):
              raise ValueError("YouTube cards markers not found in README.md")
          content = re.sub(
              pattern,
              lambda m: m.group(1) + "\n" + markdown + "\n" + m.group(2),
              content,
              flags=re.DOTALL,
          )
          with open("README.md", "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Update YouTube cards ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash
            git push
          else
            echo "No changes to commit"
          fi
